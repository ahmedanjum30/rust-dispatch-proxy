name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Run the JavaScript-based actions (checkout, artifacts, release) on Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  WINTUN_VERSION: "0.14.1"

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            wintun_arch: amd64
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            wintun_arch: arm64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The version comes from rust-toolchain.toml; keep the two in step.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build GUI (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release -p proxy-gui --target ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "rust-dispatch-proxy-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Invoke-WebRequest "https://www.wintun.net/builds/wintun-$env:WINTUN_VERSION.zip" -OutFile wintun.zip
          Expand-Archive wintun.zip -DestinationPath wintun-src
          Copy-Item "wintun-src/wintun/bin/${{ matrix.wintun_arch }}/wintun.dll" "dist/$name/"
          Copy-Item "wintun-src/wintun/LICENSE.txt" "dist/$name/WINTUN-LICENSE.txt"
          Copy-Item "target/${{ matrix.target }}/release/rust-dispatch-proxy.exe", README.md, LICENSE "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          # The control panel is a separate download, next to the zip.
          Copy-Item "target/${{ matrix.target }}/release/proxy-gui.exe" "dist/proxy-gui-${{ github.ref_name }}-${{ matrix.target }}.exe"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          name="rust-dispatch-proxy-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/rust-dispatch-proxy" README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
