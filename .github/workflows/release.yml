name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  WINTUN_VERSION: "0.14.1"

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            wintun_arch: amd64
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            wintun_arch: arm64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # The version comes from rust-toolchain.toml; keep the two in step.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build GUI (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release -p proxy-gui --target ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "rust-dispatch-proxy-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Invoke-WebRequest "https://www.wintun.net/builds/wintun-$env:WINTUN_VERSION.zip" -OutFile wintun.zip
          Expand-Archive wintun.zip -DestinationPath wintun-src
          Copy-Item "wintun-src/wintun/bin/${{ matrix.wintun_arch }}/wintun.dll" "dist/$name/"
          Copy-Item "wintun-src/wintun/LICENSE.txt" "dist/$name/WINTUN-LICENSE.txt"
          Copy-Item "target/${{ matrix.target }}/release/rust-dispatch-proxy.exe", README.md, LICENSE "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          # The control panel is a separate download, next to the zip.
          Copy-Item "target/${{ matrix.target }}/release/proxy-gui.exe" "dist/proxy-gui-${{ github.ref_name }}-${{ matrix.target }}.exe"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          name="rust-dispatch-proxy-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/rust-dispatch-proxy" README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt

      # The notes: this version's section of CHANGELOG.md, then how to install.
      # GitHub adds the list of changes below them.
      - uses: actions/checkout@v7
        with:
          path: source
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - name: Write the release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The lines under "## [<version>]", up to the next version's heading.
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' source/CHANGELOG.md > changes.md
          {
            echo "## What's new in $version"
            if grep -q '[^[:space:]]' changes.md; then
              cat changes.md
            else
              echo "::warning::CHANGELOG.md has no entry for $version" >&2
            fi
          } > notes.md
          cat >> notes.md <<'EOF'

          ## Install

          **Windows, the easy way:** download **proxy-gui-__TAG__-x86_64-pc-windows-msvc.exe** below (or the `aarch64` one for an ARM laptop), save it anywhere and double-click it. Everything is in that one file, under 1 MB: the proxy and its control panel, with nothing else to download. It updates itself — press **Check for updates**.

          > **Windows says "Windows protected your PC"?** Click **More info**, then **Run anyway**. The proxy isn't code-signed yet, so Windows doesn't know the publisher. The file is the one built by this repository's release workflow; you can check it against `SHA256SUMS.txt`.

          **From a terminal, or for TUN mode:** the **`-x86_64-pc-windows-msvc.zip`** (or `aarch64`) has `rust-dispatch-proxy.exe`, `wintun.dll` for TUN mode and the licenses. Unzip it and run `rust-dispatch-proxy.exe` from a terminal.

          **Linux:** the **`-x86_64-unknown-linux-gnu.tar.gz`** has the command line. Unpack it and run `./rust-dispatch-proxy`.

          Use the `x86_64` downloads for most PCs and `aarch64` for ARM.
          EOF
          sed -i "s/__TAG__/$GITHUB_REF_NAME/g" notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          # This version's changes and how to install, above the generated list.
          body_path: notes.md
          generate_release_notes: true
