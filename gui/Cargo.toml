[package]
name = "proxy-gui"
version = "1.5.0"
edition = "2024"
rust-version = "1.88"
description = "Windows control panel for rust-dispatch-proxy"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/ahmedanjum30/rust-dispatch-proxy"
publish = false

[[bin]]
name = "proxy-gui"
path = "src/main.rs"

# The window uses Windows' own controls, so no GUI library is needed.
[target.'cfg(windows)'.dependencies]
# The proxy itself, so proxy-gui.exe works on its own (without TUN mode).
rust-dispatch-proxy = { path = "..", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61", features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinInet",
    "Win32_Networking_WinSock",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
# Embeds the Windows manifest: modern control styles and sharp DPI scaling.
embed-manifest = "1.5"
