[package]
name = "proxy-gui"
version = "1.3.0"
edition = "2024"
rust-version = "1.92"
description = "Windows control panel for rust-dispatch-proxy"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/ahmedanjum30/rust-dispatch-proxy"
publish = false

[[bin]]
name = "proxy-gui"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
# The proxy itself, so proxy-gui.exe works on its own (without TUN mode).
rust-dispatch-proxy = { path = "..", default-features = false }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }
